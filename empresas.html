    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // --- GESTIÓN DEL TEMA (MODO OSCURO/CLARO) ---
            const themeToggle = document.getElementById('theme-toggle');
            const htmlEl = document.documentElement;

            const applyTheme = (theme) => {
                if (theme === 'dark') {
                    htmlEl.classList.add('dark');
                    if (themeToggle) themeToggle.querySelector('.material-symbols-outlined').textContent = 'light_mode';
                } else {
                    htmlEl.classList.remove('dark');
                    if (themeToggle) themeToggle.querySelector('.material-symbols-outlined').textContent = 'dark_mode';
                }
            };

            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme(savedTheme);

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const newTheme = htmlEl.classList.contains('dark') ? 'light' : 'dark';
                    localStorage.setItem('theme', newTheme);
                    applyTheme(newTheme);
                });
            }

            const container = document.getElementById('scroll-container');
            const list = document.getElementById('companies-list');
            const countEl = document.getElementById('company-count');
            const authContainer = document.getElementById('auth-container');
            const superAdminLink = document.getElementById('super-admin-link');

            let userAccount = null;
            try {
                userAccount = JSON.parse(sessionStorage.getItem('userAccount') || localStorage.getItem('userAccount'));
            } catch(e) {
                console.error('Error parsing user account:', e);
            }

            // Render Auth UI inmediatamente (0ms)
            if (userAccount && authContainer) {
                authContainer.innerHTML = `
                <a href="perfil.html" class="flex items-center gap-1 hover:underline text-[10px] uppercase tracking-wider font-medium text-text-light dark:text-white" title="Ver mi perfil">
                    <span class="material-symbols-outlined text-[14px]">account_circle</span>
                    <span>Hola, ${userAccount.name ? userAccount.name.split(' ')[0] : 'Usuario'}</span>
                </a>
                <button id="logout-button" class="text-text-light dark:text-white hover:text-primary text-[10px] uppercase tracking-wider font-medium">Cerrar sesión</button>
                `;
                document.getElementById('logout-button')?.addEventListener('click', () => {
                    sessionStorage.removeItem('userAccount');
                    localStorage.removeItem('userAccount');
                    window.location.reload();
                });
            }

            // Normalize text helper
            const cleanText = (str) => {
                if (!str) return '';
                return str.toLowerCase()
                          .normalize("NFD")
                          .replace(/[\u0300-\u036f]/g, "")
                          .replace(/[^a-z0-9]/g, "")
                          .trim();
            };

            // Función centralizada para consolidar y pintar empresas (0ms)
            const renderCompaniesUI = (staticEmpresas = [], allCompanies = [], users = [], projectAccessSet = new Set()) => {
                const mergedCompaniesMap = new Map();

                if (Array.isArray(staticEmpresas)) {
                    staticEmpresas.forEach(se => {
                        if (se.deleted) return;
                        mergedCompaniesMap.set(se.id, {
                            id: se.id,
                            name: se.name,
                            code: se.code || (se.name ? se.name.substring(0,3).toUpperCase() : 'BIM'),
                            location: se.location || se.city || 'Sede Principal',
                            image: se.image || 'https://i.postimg.cc/02mTnnQv/21bd5ee9d2351270615280386caad1f3.jpg',
                            configUrl: se.configUrl || `config-${se.id}.json`,
                            admins: se.admins || [],
                            members: se.members || []
                        });
                    });
                }

                if (Array.isArray(allCompanies)) {
                    allCompanies.forEach(c => {
                        if (!c.name) return;
                        const cNameClean = cleanText(c.name);
                        const cRazonClean = cleanText(c.razonSocial);
                        const adminEmail = c.email ? c.email.toLowerCase().trim() : '';

                        let foundKey = null;
                        for (const [key, existing] of mergedCompaniesMap.entries()) {
                            if (existing.id === c.id || cleanText(existing.name) === cNameClean || (cRazonClean && cleanText(existing.name) === cRazonClean)) {
                                foundKey = key;
                                break;
                            }
                        }

                        if (foundKey) {
                            const existing = mergedCompaniesMap.get(foundKey);
                            if (adminEmail && !existing.admins.some(a => a.toLowerCase().trim() === adminEmail)) {
                                existing.admins.push(adminEmail);
                            }
                            mergedCompaniesMap.set(foundKey, {
                                ...existing,
                                location: c.city ? `${c.city}, ${c.country || 'Colombia'}` : existing.location,
                                image: existing.image || c.image || c.logoBase64 || 'https://i.postimg.cc/02mTnnQv/21bd5ee9d2351270615280386caad1f3.jpg'
                            });
                        } else {
                            const id = c.id || 'company-' + Date.now();
                            const initialAdmins = adminEmail ? [adminEmail] : [];
                            const initialMembers = adminEmail ? [{
                                name: adminEmail.split('@')[0],
                                email: adminEmail,
                                role: 'ADMINISTRADOR_EMPRESA',
                                empresaUsuario: c.name || c.legalName,
                                cargo: 'Administrador de Empresa'
                            }] : [];

                            mergedCompaniesMap.set(id, {
                                id: id,
                                name: c.name || c.legalName,
                                code: c.code || (c.name ? c.name.substring(0,3).toUpperCase() : 'BIM'),
                                location: c.city ? `${c.city}, ${c.country || 'Colombia'}` : 'Sede Principal',
                                image: c.image || c.logoBase64 || 'https://i.postimg.cc/02mTnnQv/21bd5ee9d2351270615280386caad1f3.jpg',
                                configUrl: c.configUrl || `config-${id}.json`,
                                admins: initialAdmins,
                                members: initialMembers
                            });
                        }
                    });
                }

                if (Array.isArray(users)) {
                    users.forEach(u => {
                        if (!u.email || !u.empresa) return;
                        const uEmailClean = u.email.toLowerCase().trim();
                        const uEmpClean = cleanText(u.empresa);

                        for (const [key, comp] of mergedCompaniesMap.entries()) {
                            if (cleanText(comp.name) === uEmpClean || cleanText(comp.razonSocial) === uEmpClean) {
                                if (u.rol === 'ADMINISTRADOR_EMPRESA') {
                                    if (!comp.admins.some(a => a.toLowerCase().trim() === uEmailClean)) {
                                        comp.admins.push(uEmailClean);
                                    }
                                }
                                const mIdx = comp.members.findIndex(m => m.email && m.email.toLowerCase().trim() === uEmailClean);
                                const memberObj = {
                                    name: u.nombre || uEmailClean.split('@')[0],
                                    email: uEmailClean,
                                    role: u.rol || 'INVITADO',
                                    empresaUsuario: u.empresa,
                                    cargo: (JSON.parse(localStorage.getItem('nora_company_users_override') || '{}'))[uEmailClean]?.cargo || u.cargo || (u.rol === 'ADMINISTRADOR_EMPRESA' ? 'Administrador de Empresa' : '')
                                };
                                if (mIdx > -1) {
                                    comp.members[mIdx] = { ...comp.members[mIdx], ...memberObj };
                                } else {
                                    comp.members.push(memberObj);
                                }
                            }
                        }
                    });
                }

                const consolidatedCompanies = Array.from(mergedCompaniesMap.values());
                const userEmail = (userAccount && userAccount.username) ? userAccount.username.toLowerCase().trim() : '';

                // Helper to render individual company card
                const renderCard = (c, isGuest = false) => {
                    const isAdminOfCompany = (Array.isArray(c.admins) && c.admins.some(a => a.toLowerCase().trim() === userEmail)) ||
                                            (c.email && c.email.toLowerCase().trim() === userEmail) ||
                                            (Array.isArray(c.members) && c.members.some(m => m.email && m.email.toLowerCase().trim() === userEmail && (m.role === 'ADMINISTRADOR_EMPRESA' || m.role === 'ADMINISTRADOR')));

                    let badgeLabel = 'Miembro Corporativo';
                    let badgeIcon = 'corporate_fare';
                    let badgeColor = 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/70 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800';
                    let bottomBadgeColor = 'text-emerald-700 dark:text-emerald-300 border-emerald-100 dark:border-emerald-900';
                    let bottomBadgeText = 'Miembro Corporativo';

                    if (isGuest) {
                        badgeLabel = 'Invitado';
                        badgeIcon = 'badge';
                        badgeColor = 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950/70 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800';
                        bottomBadgeColor = 'text-indigo-700 dark:text-indigo-300 border-indigo-100 dark:border-indigo-900';
                        bottomBadgeText = 'Acceso Invitado';
                    } else if (isAdminOfCompany) {
                        badgeLabel = 'Administrador';
                        badgeIcon = 'admin_panel_settings';
                        badgeColor = 'bg-blue-100 text-blue-800 dark:bg-blue-950/70 dark:text-blue-300 border-blue-200 dark:border-blue-800';
                        bottomBadgeColor = 'text-blue-700 dark:text-blue-300 border-blue-100 dark:border-blue-900';
                        bottomBadgeText = 'Administrador de Empresa';
                    }

                    return `
                    <a href="home.html?empresa=${c.id}&v=${Date.now()}" class="card-hover flex-none w-[260px] md:w-[320px] lg:w-[360px] group transition-transform duration-500 block">
                        <div class="flex justify-between items-end mb-4 border-b border-gray-300 dark:border-gray-700 pb-2">
                            <div class="flex flex-col min-w-0 pr-2">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">${c.code || 'BIM'}</span>
                                    <span class="text-[8px] font-black uppercase tracking-wider ${badgeColor} px-2 py-0.5 rounded-md border flex items-center gap-1">
                                        <span class="material-symbols-outlined text-[10px]">${badgeIcon}</span>
                                        ${badgeLabel}
                                    </span>
                                </div>
                                <span class="text-xs font-bold uppercase tracking-wider text-gray-800 dark:text-gray-200 truncate">${c.name}</span>
                            </div>
                            <span class="text-[9px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-widest text-right flex-shrink-0">${c.location}</span>
                        </div>
                        <div class="w-full aspect-[4/5] bg-gray-200 dark:bg-gray-800 overflow-hidden relative rounded-xl shadow-sm group-hover:shadow-md transition-shadow">
                            <div class="w-full h-full card-image-wrapper">
                                <img src="${c.image}" alt="${c.name}" class="w-full h-full object-cover filter brightness-95 contrast-105" />
                            </div>
                            <div class="absolute bottom-3 left-3 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md px-3 py-1.5 rounded-lg text-[9px] font-bold uppercase tracking-widest ${bottomBadgeColor} shadow-md flex items-center gap-1.5 border">
                                <span class="material-symbols-outlined text-[14px]">${badgeIcon}</span>
                                <span>${bottomBadgeText}</span>
                            </div>
                        </div>
                    </a>
                `;
                };

                if (userAccount && userAccount.role === 'SUPER_ADMINISTRADOR') {
                    if (superAdminLink) superAdminLink.classList.remove('hidden');
                    countEl.textContent = `(${consolidatedCompanies.length})`;

                    list.innerHTML = `
                        <div class="w-full flex flex-col gap-6">
                            <div class="flex items-center gap-2 text-xs font-black uppercase tracking-wider text-gray-500">
                                <span class="material-symbols-outlined text-[16px] text-primary">admin_panel_settings</span>
                                <span>Todas las Empresas Registradas (Vista Super Administrador)</span>
                            </div>
                            <div class="flex flex-wrap justify-start gap-8 lg:gap-12">
                                ${consolidatedCompanies.map(c => renderCard(c, false)).join('')}
                            </div>
                        </div>
                    `;
                    return consolidatedCompanies;
                }

                const belongingCompanies = [];
                const guestCompanies = [];

                consolidatedCompanies.forEach(c => {
                    const cNameClean = cleanText(c.name);
                    const cRazonClean = cleanText(c.razonSocial);
                    
                    const isAdminOfCompany = (Array.isArray(c.admins) && c.admins.some(a => a.toLowerCase().trim() === userEmail)) ||
                                            (c.email && c.email.toLowerCase().trim() === userEmail);
                    
                    const memberMatch = Array.isArray(c.members) ? c.members.find(m => m.email && m.email.toLowerCase().trim() === userEmail) : null;
                    const isRegisteredMember = Boolean(memberMatch);
                    const isCorporateMember = memberMatch && (memberMatch.role === 'ADMINISTRADOR_EMPRESA' || memberMatch.role === 'ADMINISTRADOR' || memberMatch.role === 'MIEMBRO');
                    const isExplicitGuest = memberMatch && memberMatch.role === 'INVITADO';
                    
                    const userHomeEmpClean = userAccount ? cleanText(userAccount.empresa) : '';
                    const isCompanyMatchesUserHome = Boolean(userHomeEmpClean && (userHomeEmpClean === cNameClean || userHomeEmpClean === cRazonClean));

                    const hasProjectInvitation = projectAccessSet.has(c.id);

                    if (isAdminOfCompany || isCorporateMember || isCompanyMatchesUserHome) {
                        belongingCompanies.push(c);
                    } else if (isExplicitGuest || isRegisteredMember || hasProjectInvitation) {
                        guestCompanies.push(c);
                    }
                });

                if (belongingCompanies.length === 0 && guestCompanies.length === 0 && userAccount && userAccount.empresa) {
                    const fallbackName = userAccount.empresa;
                    const matchedFallback = consolidatedCompanies.find(c => 
                        cleanText(c.name).includes(cleanText(fallbackName)) || 
                        cleanText(fallbackName).includes(cleanText(c.name))
                    );
                    if (matchedFallback) {
                        belongingCompanies.push(matchedFallback);
                    }
                }

                countEl.textContent = `(${belongingCompanies.length + guestCompanies.length})`;

                if (belongingCompanies.length === 0 && guestCompanies.length === 0) {
                    list.innerHTML = `
                        <div class="w-full py-16 text-center flex flex-col items-center justify-center">
                            <span class="material-symbols-outlined text-gray-400 text-5xl mb-3">domain_disabled</span>
                            <p class="text-sm font-semibold text-gray-600 dark:text-gray-300">No tienes empresas asignadas actualmente</p>
                            <p class="text-xs text-gray-400 mt-1 max-w-sm">Comunícate con el Administrador de tu organización o con nora BIM para habilitar tu acceso corporativo.</p>
                        </div>
                    `;
                    return consolidatedCompanies;
                }

                const leftSection = belongingCompanies.length > 0 ? `
                    <div class="flex flex-col gap-6 flex-1 min-w-[280px]">
                        <div class="flex flex-col gap-1 border-b border-gray-200 dark:border-gray-800 pb-3">
                            <div class="flex items-center gap-2 text-xs font-black uppercase tracking-wider text-gray-900 dark:text-white">
                                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                                <span>Mi Empresa</span>
                                <span class="text-[10px] text-gray-400 font-normal">Sede Principal</span>
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Espacio de trabajo corporativo al que perteneces directamente.</p>
                        </div>
                        <div class="flex flex-wrap justify-start gap-8 lg:gap-12">
                            ${belongingCompanies.map(c => renderCard(c, false)).join('')}
                        </div>
                    </div>
                ` : '';

                const rightSection = guestCompanies.length > 0 ? `
                    <div class="flex flex-col gap-6 flex-1 min-w-[280px]">
                        <div class="flex flex-col gap-1 border-b border-gray-200 dark:border-gray-800 pb-3">
                            <div class="flex items-center gap-2 text-xs font-black uppercase tracking-wider text-gray-900 dark:text-white">
                                <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                                <span>Empresas como Invitado</span>
                                <span class="text-[10px] text-gray-400 font-normal">Colaboración</span>
                            </div>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Organizaciones y proyectos donde has sido invitado a colaborar.</p>
                        </div>
                        <div class="flex flex-wrap justify-start gap-8 lg:gap-12">
                            ${guestCompanies.map(c => renderCard(c, true)).join('')}
                        </div>
                    </div>
                ` : '';

                const htmlContent = `
                    <div style="display: flex; flex-direction: row; gap: 2rem; align-items: flex-start; flex-wrap: nowrap; width: 100%; min-width: 0;">
                        ${leftSection || ''}
                        <div style="width: 1px; min-height: 100%; background: rgba(15, 23, 42, 0.12); align-self: stretch; margin: 0 0.5rem; opacity: 0.8;"></div>
                        ${rightSection || ''}
                    </div>
                    <style>
                        @media (max-width: 980px) {
                            #companies-list > div {
                                flex-direction: column !important;
                                flex-wrap: wrap !important;
                            }
                            #companies-list > div > div[style*="width: 1px"] {
                                display: none !important;
                            }
                        }
                    </style>
                `;
                list.innerHTML = htmlContent;
                return consolidatedCompanies;
            };

            // PASO 1: Renderizado Ultra-Rápido Inmediato (0ms desde caché)
            let staticEmpresas = [];
            try {
                if (window.NoraDriveStore && typeof window.NoraDriveStore.getJson === 'function') {
                    staticEmpresas = await window.NoraDriveStore.getJson('empresas.json');
                } else {
                    const localCached = localStorage.getItem('nora_drive_cache_empresas.json') || sessionStorage.getItem('nora_drive_cache_empresas.json');
                    if (localCached) staticEmpresas = JSON.parse(JSON.parse(localCached).raw);
                }
            } catch(e) {}

            if (Array.isArray(staticEmpresas) && staticEmpresas.length > 0) {
                renderCompaniesUI(staticEmpresas, [], []);
            }

            // PASO 2: Sincronización en Segundo Plano sin bloquear la pantalla
            try {
                const url = 'https://script.google.com/macros/s/AKfycbx2RAQx_8K4o22xE0Mw-ETc7K_58vIoi6-PgVi64u80inuiw144ks3cgWSdCtXqIgB02g/exec';

                const [compRes, userRes, freshStaticRes] = await Promise.allSettled([
                    fetch(url + '?action=getCompanies'),
                    fetch(url),
                    window.NoraDriveStore ? window.NoraDriveStore.getJson('empresas.json', { force: true }) : fetch('empresas.json').then(r => r.json())
                ]);

                let allCompanies = compRes.status === 'fulfilled' && compRes.value.ok ? await compRes.value.json() : [];
                let users = userRes.status === 'fulfilled' && userRes.value.ok ? await userRes.value.json() : [];
                if (freshStaticRes.status === 'fulfilled' && freshStaticRes.value) {
                    staticEmpresas = freshStaticRes.value;
                }

                // Validación de usuario en segundo plano
                const userEmail = (userAccount && userAccount.username) ? userAccount.username.toLowerCase().trim() : '';
                if (userEmail && userAccount.role !== 'SUPER_ADMINISTRADOR' && userEmail !== 'imagina3ddesign@gmail.com' && Array.isArray(users) && users.length > 0) {
                    const userEntries = users.filter(u => u.email && u.email.toLowerCase().trim() === userEmail);
                    if (userEntries.length > 0) {
                        const activeEntry = userEntries.reverse().find(u => {
                            const dbEstado = u.estado ? u.estado.toUpperCase().trim() : '';
                            const dbRol = u.rol ? u.rol.toUpperCase().trim() : '';
                            return dbEstado === 'APROBADO' || dbRol === 'SUPER_ADMINISTRADOR' || dbRol === 'ADMINISTRADOR_EMPRESA' || dbRol === 'MIEMBRO';
                        });
                        if (activeEntry) {
                            userAccount.role = activeEntry.rol;
                            userAccount.empresa = activeEntry.empresa || '';
                            if (activeEntry.nombre && activeEntry.nombre.trim() !== '') {
                                userAccount.name = activeEntry.nombre.trim();
                            }
                            const cacheLocation = localStorage.getItem('userAccount') ? 'localStorage' : 'sessionStorage';
                            window[cacheLocation].setItem('userAccount', JSON.stringify(userAccount));
                        }
                    }
                }

                // Renderizar con datos frescos en segundo plano
                const consolidated = renderCompaniesUI(staticEmpresas, allCompanies, users);

                // Comprobar invitaciones a proyectos en segundo plano de manera asíncrona
                if (userEmail && userAccount && userAccount.role !== 'SUPER_ADMINISTRADOR' && Array.isArray(consolidated)) {
                    const projectAccessCompanyIds = new Set();
                    Promise.allSettled(
                        consolidated.filter(c => c.configUrl).map(async c => {
                            try {
                                const conf = window.NoraDriveStore ? await window.NoraDriveStore.getJson(c.configUrl) : await (await fetch(c.configUrl)).json();
                                if (conf && Array.isArray(conf.projects) && conf.projects.some(p =>
                                    Array.isArray(p.members) && p.members.some(pm => (typeof pm === 'string' ? pm : pm?.email || '').toLowerCase().trim() === userEmail)
                                )) {
                                    projectAccessCompanyIds.add(c.id);
                                }
                            } catch(err) {}
                        })
                    ).then(() => {
                        if (projectAccessCompanyIds.size > 0) {
                            renderCompaniesUI(staticEmpresas, allCompanies, users, projectAccessCompanyIds);
                        }
                    });
                }

            } catch (e) {
                console.error("Error en sincronización en segundo plano:", e);
            }
        });
    </script>
</body>

</html>
