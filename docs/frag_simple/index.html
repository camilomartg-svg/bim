<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC to FRAG Simple | Nora BIM</title>
    <script>
      // Redirigir automáticamente a la versión compilada en dist/ cuando se ejecuta online
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && !location.pathname.includes('/dist/')) {
        var path = location.pathname;
        if (path.endsWith('/index.html')) path = path.slice(0, -10);
        if (!path.endsWith('/')) path += '/';
        location.replace(path + 'dist/' + location.search + location.hash);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
