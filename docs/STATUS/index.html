    <div id="update-banner"><div class="inner"><div>Hay una nueva versión disponible.</div><button id="update-reload" type="button">Actualizar</button></div></div>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var meta = document.querySelector('meta[name="x-app-version"]');
          var appId = meta && meta.getAttribute('data-app') || 'status';
          var version = meta && meta.getAttribute('content') || '';
          var key = appId + ':appVersion';
          var stored = localStorage.getItem(key) || '';
          var banner = document.getElementById('update-banner');
          var btn = document.getElementById('update-reload');
          if (version) {
            if (!stored) localStorage.setItem(key, version);
            else if (stored !== version && banner) banner.style.display = 'block';
          }
          if (btn) {
            btn.addEventListener('click', function () {
              try { localStorage.setItem(key, version); } catch (e) {}
              try {
                if ('serviceWorker' in navigator) {
                  navigator.serviceWorker.getRegistration().then(function (reg) {
                    if (reg && reg.waiting) {
                      reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                    if (reg) {
                      reg.update().finally(function () {
                        var u = new URL(location.href);
                        if (version) u.searchParams.set('v', version);
                        location.replace(u.toString());
                      });
                    } else {
                      var u2 = new URL(location.href);
                      if (version) u2.searchParams.set('v', version);
                      location.replace(u2.toString());
                    }
                  });
                } else {
                  var u3 = new URL(location.href);
                  if (version) u3.searchParams.set('v', version);
                  location.replace(u3.toString());
                }
              } catch (e) {
                location.reload();
              }
            });
          }
        } catch (e) {}
      })();
    </script>

  
                <!-- VIEWER LOGO INJECT START -->
    <script>
        (async function() {
            try {
                const metaVersion = document.querySelector('meta[name="x-app-version"]');
                const currentVersion = metaVersion?.getAttribute('content') || Date.now().toString();
                
                const params = new URLSearchParams(window.location.search);
                const projectSlug = params.get('project');
                let companyId = params.get('empresa');
                if (!companyId) {
                    try {
                        const currentUser = JSON.parse(sessionStorage.getItem('userAccount') || localStorage.getItem('userAccount') || 'null');
                        companyId = currentUser?.adminEmpresaId || sessionStorage.getItem('empresa') || '';
                    } catch (e) {}
                }

                let currentResolvedProjectName = params.get('driveFolderName') || params.get('projectName') || params.get('project') || '';
                if (currentResolvedProjectName) currentResolvedProjectName = decodeURIComponent(currentResolvedProjectName);

                function ensureProjectBadge(logoEl, pName) {
                    const resolvedName = pName || currentResolvedProjectName;
                    if (!resolvedName) return;
                    let badge = document.getElementById('viewer-project-badge');
                    if (!badge && logoEl) {
                        badge = document.createElement('div');
                        badge.id = 'viewer-project-badge';
                        badge.className = 'viewer-project-badge';
                        badge.innerHTML = '<span class="material-symbols-outlined" style="font-size: 15px; opacity: 0.7; flex-shrink: 0;">apartment</span><span id="viewer-project-name" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>';
                        const parentAnchor = logoEl.closest('a') || logoEl;
                        if (parentAnchor.parentNode) {
                            parentAnchor.parentNode.insertBefore(badge, parentAnchor.nextSibling);
                        }
                    }
                    const nameEl = document.getElementById('viewer-project-name');
                    if (nameEl && resolvedName) {
                        nameEl.textContent = resolvedName;
                        nameEl.setAttribute('title', resolvedName);
                    }
                    if (badge) badge.style.display = 'inline-flex';
                }

                // Initial try if logo-img already exists
                const initialLogo = document.getElementById('logo-img');
                if (initialLogo && currentResolvedProjectName) {
                    ensureProjectBadge(initialLogo, currentResolvedProjectName);
                }

                let config = null;
                if (companyId) {
                    try {
                        const empRes = await fetch(`../empresas.json?t=${Date.now()}`);
                        if (empRes.ok) {
                            const empresas = await empRes.json();
                            const currentCompany = empresas.find(e => e.id === companyId);
                            if (currentCompany && currentCompany.configUrl) {
                                const response = await fetch(`../${currentCompany.configUrl}?v=${encodeURIComponent(currentVersion)}`, { cache: 'no-store' });
                                if (response.ok) config = await response.json();
                            }
                        }
                    } catch (e) {
                        console.warn('Error loading empresas.json or company config in logo script', e);
                    }
                }

                if (!config) {
                    try {
                        const response = await fetch(`../portal-config.json?v=${encodeURIComponent(currentVersion)}`, { cache: 'no-store' });
                        if (response.ok) config = await response.json();
                    } catch (e) {}
                }

                if (!config) {
                    const draft = localStorage.getItem('portal:pba-config-draft:v2');
                    if (draft) config = JSON.parse(draft);
                }

                if (!config) return;
                
                // Fallback a los logos del portal
                let lightLogo = config.portal?.logoLight || 'https://i.postimg.cc/L4r0gSvV/LOGO-TEXTO-NORA-NEGRO.png';
                let darkLogo = config.portal?.logoDark || 'https://i.postimg.cc/FFfBKzb8/LOGO-TEXTO-NORA-BLANCO.png';
                
                if (projectSlug && config.projects) {
                    const proj = config.projects.find(p => p.slug === projectSlug || p.id === projectSlug || p.name === projectSlug);
                    if (proj) {
                        currentResolvedProjectName = proj.name || proj.title || proj.slug;
                        const targetLogo = document.getElementById('logo-img');
                        ensureProjectBadge(targetLogo, currentResolvedProjectName);

                        try {
                            const userAccount = JSON.parse(sessionStorage.getItem('userAccount') || localStorage.getItem('userAccount') || '{}');
                            const isSuperAdmin = userAccount.role === 'SUPER_ADMINISTRADOR' || userAccount.username === 'imagina3ddesign@gmail.com';
                            if (!isSuperAdmin && window.WompiModule) {
                                const lic = window.WompiModule.canAccessProject(proj, 3);
                                if (!lic.canAccess) {
                                    window.WompiModule.renderSuspensionOverlay(document.body, {
                                        moduleName: 'Visores nora',
                                        moduleDescription: 'El acceso se encuentra suspendido por falta de pago (+5 días de mora).',
                                        projectSlug: proj.slug || projectSlug,
                                        companyId: companyId
                                    });
                                    const appEl = document.getElementById('viewer-container') || document.getElementById('app') || document.getElementById('root');
                                    if (appEl) { appEl.style.filter = 'blur(8px)'; appEl.style.pointerEvents = 'none'; }
                                    return;
                                }
                            }
                        } catch (licErr) { console.warn('Error comprobando suspension:', licErr); }
                    }
                    if (proj && proj.landing) {
                        if (proj.landing.viewerLogoLight) lightLogo = proj.landing.viewerLogoLight;
                        else if (proj.landing.portalLogoLight) lightLogo = proj.landing.portalLogoLight;
                        
                        if (proj.landing.viewerLogoDark) darkLogo = proj.landing.viewerLogoDark;
                        else if (proj.landing.portalLogoDark) darkLogo = proj.landing.portalLogoDark;
                    }
                }
                
                const setupLogoOverride = (logoImg) => {
                    const updateLogo = () => {
                        const isDark = document.body.classList.contains('dark-mode') || document.documentElement.classList.contains('dark');
                        const desiredSrc = isDark ? darkLogo : lightLogo;
                        if (logoImg.getAttribute('src') !== desiredSrc) {
                            logoImg.src = desiredSrc;
                        }
                        ensureProjectBadge(logoImg, currentResolvedProjectName);
                    };

                    const observer = new MutationObserver(() => updateLogo());
                    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
                    observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
                    
                    const origSetAttribute = logoImg.setAttribute.bind(logoImg);
                    logoImg.setAttribute = function(name, value) {
                        if (name === 'src') {
                            const isDark = document.body.classList.contains('dark-mode') || document.documentElement.classList.contains('dark');
                            const desiredSrc = isDark ? darkLogo : lightLogo;
                            if (value !== desiredSrc) {
                                origSetAttribute('src', desiredSrc);
                                return;
                            }
                        }
                        origSetAttribute(name, value);
                    };

                    updateLogo();
                };

                // Wait for element to be present in DOM
                const logoImg = document.getElementById('logo-img');
                if (logoImg) {
                    setupLogoOverride(logoImg);
                } else {
                    const bodyObserver = new MutationObserver((mutations, obs) => {
                        const target = document.getElementById('logo-img');
                        if (target) {
                            setupLogoOverride(target);
                            obs.disconnect();
                        }
                    });
                    bodyObserver.observe(document.body || document.documentElement, {
                        childList: true,
                        subtree: true
                    });
                }
            } catch (e) {
                console.warn('Error loading dynamic logo and project badge', e);
            }
        })();
    </script>
    <!-- VIEWER LOGO INJECT END -->

</body>
