    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4F4F4;
            color: #111;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        /* Hide scrollbar for Chrome, Safari and Opera */

            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */

        /* The custom cursor "DRAG" */
        #custom-cursor {
            pointer-events: none;

        .card-hover:hover .card-image-wrapper {

</head>

<body class="min-h-screen w-full flex flex-col relative">

    

    <!-- Header -->
    <header class="absolute top-0 left-0 w-full z-10 px-8 py-4">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="back-btn" aria-label="Volver"
                    class="rounded-lg border border-border-light bg-white/80 px-2 py-1 hover:bg-white transition-colors">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                </button>
            </div>
            <div class="flex items-center space-x-4">
                <button id="theme-toggle" aria-label="Cambiar tema"
                    class="text-text-light dark:text-white hover:text-primary"><span
                        class="material-symbols-outlined text-[16px]">dark_mode</span></button>
                <div id="auth-container" class="flex items-center space-x-4"><a
                        href="https://norabim.com/inse.html"
                        class="text-text-light dark:text-white hover:text-primary text-xs font-medium uppercase tracking-wider">Iniciar
                        sesión</a></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col justify-start w-full relative z-0">
        <!-- Banner Identico a home.html -->
        <section class="relative flex h-[270px] pt-14 overflow-hidden w-full">
            <!-- Panel Izquierdo (30%) con color sólido y logo -->
            <div class="w-[30%] bg-[#f6f6f6] dark:bg-background-dark h-full flex items-center justify-center p-8">
                <div class="block w-full max-w-[160px]">
                    <img id="portal-logo-light" alt="nora CDE" class="w-full h-auto object-contain dark:hidden"
                        src="https://i.postimg.cc/tR3YSryT/LOGO-NORA-NEGRO.png" />
                    <img id="portal-logo-dark" alt="nora CDE" class="w-full h-auto object-contain hidden dark:block"
                        src="https://i.postimg.cc/SQ6JTZqj/LOGO-NORA-BLANCO.png" />

            <!-- Panel Derecho (70%) con imagen -->
            <div id="home-hero-image" class="w-[70%] h-full bg-cover bg-center"
                style="background-image: url('https://i.postimg.cc/hPxkssjB/a876e83e4696eea7592b3fef6c8275a8.jpg');">
            </div>
        </section>

        <!-- Container principal inferior -->
        <div class="px-8 flex-1 flex flex-col justify-start py-8">
        
        <!-- Top Section: Title & Description -->
        <div class="flex flex-col md:flex-row justify-between items-end mb-8 w-full max-w-[95%] mx-auto gap-4">
            <div class="flex items-start">
                <h1 class="text-6xl md:text-8xl font-medium tracking-tighter leading-none" style="letter-spacing: -0.04em;">EMPRESAS</h1>
                <span id="company-count" class="text-lg font-medium ml-4 mt-2">(0)</span>
            </div>
            <div class="hidden md:block max-w-sm text-right">
                <p class="text-sm font-medium leading-tight text-gray-600 mb-3">
                    Plataforma centralizada.<br>
                    Seleccione su espacio de trabajo corporativo para acceder a sus proyectos.
                </p>
                <a id="super-admin-link" href="super-admin.html" class="hidden inline-flex items-center gap-2 rounded-xl bg-primary px-4 py-2 text-xs font-semibold uppercase tracking-wider text-white hover:bg-black transition-colors">

                </a>

        <!-- Horizontal Scroll Section -->
        <div id="scroll-container" class="w-full max-w-[95%] mx-auto pb-8">
            <div id="companies-list" class="flex flex-wrap justify-start gap-8 lg:gap-12 px-4">
                <!-- Tarjetas inyectadas por JS -->
            </div>
        </div>
        </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-background-dark py-8 px-8 mt-auto border-t border-border-light dark:border-gray-800">
        <div class="container mx-auto text-center text-gray-500 dark:text-gray-400">
            <div class="flex items-center justify-center gap-4 mb-4">
                <!-- Logo para modo claro -->
                <img id="portal-footer-logo-light" alt="nora CDE logo" class="h-40 dark:hidden object-contain"
                    src="https://i.postimg.cc/tR3YSryT/LOGO-NORA-NEGRO.png" />
                <!-- Logo para modo oscuro -->
                <img id="portal-footer-logo-dark" alt="nora CDE logo" class="h-40 hidden dark:block object-contain"
                    src="https://i.postimg.cc/SQ6JTZqj/LOGO-NORA-BLANCO.png" />
            </div>
            <p class="text-sm" id="portal-footer-text">© 2026 nora CDE - Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {

            const container = document.getElementById('scroll-container');
            const list = document.getElementById('companies-list');
            const countEl = document.getElementById('company-count');
            const authContainer = document.getElementById('auth-container');
            const superAdminLink = document.getElementById('super-admin-link');

            let userAccount = null;
            try {
                userAccount = JSON.parse(sessionStorage.getItem('userAccount') || localStorage.getItem('userAccount'));
            } catch(e) {
                console.error('Error parsing user account:', e);
            }

            try {
                const url = 'https://script.google.com/macros/s/AKfycbx2RAQx_8K4o22xE0Mw-ETc7K_58vIoi6-PgVi64u80inuiw144ks3cgWSdCtXqIgB02g/exec';

                // Fetch ALL companies and users concurrently in real-time
                const [compRes, userRes, staticEmpRes] = await Promise.all([
                    fetch(url + '?action=getCompanies&t=' + Date.now()),
                    fetch(url + '?t=' + Date.now()),
                    fetch('empresas.json?t=' + Date.now())
                ]);
                
                let allCompanies = await compRes.json();
                let users = await userRes.json();
                let staticEmpresas = [];
                
                try {
                    if (staticEmpRes.ok) {
                        staticEmpresas = await staticEmpRes.json();
                    } else {
                        const rawRes = await fetch('https://raw.githubusercontent.com/camilomartg-svg/bim/main/empresas.json?t=' + Date.now());
                        if (rawRes.ok) staticEmpresas = await rawRes.json();
                    }
                } catch(e) { 
                    console.warn('Could not merge static empresas', e); 
                }

                // Normalize text helper
                const cleanText = (str) => {
                    if (!str) return '';
                    return str.toLowerCase()
                              .normalize("NFD")
                              .replace(/[\u0300-\u036f]/g, "")
                              .replace(/[^a-z0-9]/g, "")
                              .trim();
                };

                // Merge static empresas into allCompanies
                const mergedCompaniesMap = new Map();

                // 1. Add static empresas first (contains rich members & admin configuration from Super Admin)
                if (Array.isArray(staticEmpresas)) {
                    staticEmpresas.forEach(se => {
                        if (se.deleted) return;
                        mergedCompaniesMap.set(se.id, {
                            id: se.id,
                            name: se.name,
                            code: se.code || (se.name ? se.name.substring(0,3).toUpperCase() : 'BIM'),
                            location: se.location || se.city || 'Sede Principal',
                            image: se.image || 'https://i.postimg.cc/02mTnnQv/21bd5ee9d2351270615280386caad1f3.jpg',
                            configUrl: se.configUrl || `config-${se.id}.json`,
                            admins: se.admins || [],
                            members: se.members || []
                        });
                    });
                }

                // 2. Merge Google Sheets companies
                if (Array.isArray(allCompanies)) {
                    allCompanies.forEach(c => {
                        if (!c.name) return;
                        const cNameClean = cleanText(c.name);
                        const cRazonClean = cleanText(c.razonSocial);

                        // Find matching static empresa by id or name
                        let foundKey = null;
                        for (const [key, existing] of mergedCompaniesMap.entries()) {
                            if (existing.id === c.id || cleanText(existing.name) === cNameClean || (cRazonClean && cleanText(existing.name) === cRazonClean)) {
                                foundKey = key;
                                break;
                            }
                        }

                        if (foundKey) {
                            const existing = mergedCompaniesMap.get(foundKey);
                            mergedCompaniesMap.set(foundKey, {
                                ...existing,
                                location: c.city ? `${c.city}, ${c.country || 'Colombia'}` : existing.location,
                                image: existing.image || c.image || c.logoBase64 || 'https://i.postimg.cc/02mTnnQv/21bd5ee9d2351270615280386caad1f3.jpg'
                            });
                        } else {
                            const id = c.id || 'company-' + Date.now();
                            mergedCompaniesMap.set(id, {
                                id: id,
                                name: c.name || c.legalName,
                                code: c.code || (c.name ? c.name.substring(0,3).toUpperCase() : 'BIM'),
                                location: c.city ? `${c.city}, ${c.country || 'Colombia'}` : 'Sede Principal',
                                image: c.image || c.logoBase64 || 'https://i.postimg.cc/02mTnnQv/21bd5ee9d2351270615280386caad1f3.jpg',
                                configUrl: c.configUrl || 'portal-config.json',
                                admins: [],
                                members: []
                            });
                        }
                    });
                }

                const consolidatedCompanies = Array.from(mergedCompaniesMap.values());

                // Validate and update User
                let userEmail = '';
                if (userAccount && userAccount.username) {
                    userEmail = userAccount.username.toLowerCase().trim();
                    if (userAccount.role === 'SUPER_ADMINISTRADOR' || userEmail === 'imagina3ddesign@gmail.com') {
                        // Bypass validation for super administrators
                    } else {
                        const userEntries = users.filter(u => u.email && u.email.toLowerCase().trim() === userEmail);

                        // Block only if the user truly doesn't exist in the DB
                        if (userEntries.length === 0) {
                            alert('Tu acceso ha sido revocado o está pendiente. Cerrando sesión.');
                            sessionStorage.removeItem('userAccount');
                            localStorage.removeItem('userAccount');
                            window.location.replace('https://norabim.com/inse.html');
                            return;
                        }

                        // Find any approved entry - USE REVERSE TO GET NEWEST
                        const activeEntry = userEntries.reverse().find(u => {
                            const dbEstado = u.estado ? u.estado.toUpperCase().trim() : '';
                            const dbRol = u.rol ? u.rol.toUpperCase().trim() : '';
                            return dbEstado === 'APROBADO' || dbRol === 'SUPER_ADMINISTRADOR' || dbRol === 'ADMINISTRADOR_EMPRESA';
                        });

                        if (!activeEntry) {
                            const anyPending = userEntries.some(u => (u.estado || '').toUpperCase().trim() === 'PENDIENTE');
                            const msg = anyPending
                                ? 'Tu solicitud de acceso está pendiente de aprobación.'
                                : 'Tu acceso ha sido revocado. Contacta al administrador.';
                            alert(msg);
                            sessionStorage.removeItem('userAccount');
                            localStorage.removeItem('userAccount');
                            window.location.replace('https://norabim.com/inse.html');
                            return;
                        }

                        // User is approved — update cache with freshest role/empresa/name
                        userAccount.role = activeEntry.rol;
                        userAccount.empresa = activeEntry.empresa || '';
                        if (activeEntry.nombre && activeEntry.nombre.trim() !== '') {
                            userAccount.name = activeEntry.nombre.trim();
                        }
                        const cacheLocation = localStorage.getItem('userAccount') ? 'localStorage' : 'sessionStorage';
                        window[cacheLocation].setItem('userAccount', JSON.stringify(userAccount));
                    }
                }

                // Render Auth UI
                if (userAccount) {
                    authContainer.innerHTML = `
                    <span class="text-[10px] uppercase tracking-wider font-medium text-text-light dark:text-white">Hola, ${userAccount.name.split(' ')[0]}</span>
                    <button id="logout-button" class="text-text-light dark:text-white hover:text-primary text-[10px] uppercase tracking-wider font-medium">Cerrar sesión</button>
                    `;
                    document.getElementById('logout-button').addEventListener('click', () => {
                        sessionStorage.removeItem('userAccount');
                        localStorage.removeItem('userAccount');
                        window.location.reload();
                    });
                }

                // Pre-check project configs to discover project-level invitations
                const projectAccessCompanyIds = new Set();
                if (userEmail && userAccount && userAccount.role !== 'SUPER_ADMINISTRADOR') {
                    await Promise.allSettled(
                        consolidatedCompanies.filter(c => c.configUrl).map(async c => {
                            try {
                                const res = await fetch(`${c.configUrl}?t=${Date.now()}`);
                                if (res.ok) {
                                    const conf = await res.json();
                                    const hasProject = Array.isArray(conf.projects) && conf.projects.some(p =>
                                        Array.isArray(p.members) && p.members.some(pm => pm.toLowerCase().trim() === userEmail)
                                    );
                                    if (hasProject) {
                                        projectAccessCompanyIds.add(c.id);
                                    }
                                }
                            } catch(err) {}
                        })
                    );
                }

                // Helper to render individual company card
                const renderCard = (c, isGuest = false) => `
                    <a href="home.html?empresa=${c.id}&v=${Date.now()}" class="card-hover flex-none w-[260px] md:w-[320px] lg:w-[360px] group transition-transform duration-500 block">
                        <div class="flex justify-between items-end mb-4 border-b border-gray-300 dark:border-gray-700 pb-2">
                            <div class="flex flex-col min-w-0 pr-2">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-[9px] font-bold text-gray-400 uppercase tracking-widest">${c.code || 'BIM'}</span>
                                    ${isGuest ? `
                                        <span class="text-[8px] font-black uppercase tracking-wider bg-indigo-100 text-indigo-800 dark:bg-indigo-950/70 dark:text-indigo-300 px-2 py-0.5 rounded-md border border-indigo-200 dark:border-indigo-800 flex items-center gap-1">
                                            <span class="material-symbols-outlined text-[10px]">badge</span>
                                            Invitado
                                        </span>
                                    ` : `
                                        <span class="text-[8px] font-black uppercase tracking-wider bg-emerald-100 text-emerald-800 dark:bg-emerald-950/70 dark:text-emerald-300 px-2 py-0.5 rounded-md border border-emerald-200 dark:border-emerald-800 flex items-center gap-1">
                                            <span class="material-symbols-outlined text-[10px]">home_work</span>
                                            Mi Empresa
                                        </span>
                                    `}
                                </div>
                                <span class="text-xs font-bold uppercase tracking-wider text-gray-800 dark:text-gray-200 truncate">${c.name}</span>
                            </div>
                            <span class="text-[9px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-widest text-right flex-shrink-0">${c.location}</span>
                        </div>
                        <div class="w-full aspect-[4/5] bg-gray-200 dark:bg-gray-800 overflow-hidden relative rounded-xl shadow-sm group-hover:shadow-md transition-shadow">
                            <div class="w-full h-full card-image-wrapper">
                                <img src="${c.image}" alt="${c.name}" class="w-full h-full object-cover filter brightness-95 contrast-105" />
                            </div>
                            ${isGuest ? `
                                <div class="absolute bottom-3 left-3 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md px-3 py-1.5 rounded-lg text-[9px] font-bold uppercase tracking-widest text-indigo-700 dark:text-indigo-300 shadow-md flex items-center gap-1.5 border border-indigo-100 dark:border-indigo-900">
                                    <span class="material-symbols-outlined text-[14px]">sensor_occupied</span>
                                    <span>Acceso Invitado</span>
                                </div>
                            ` : `
                                <div class="absolute bottom-3 left-3 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md px-3 py-1.5 rounded-lg text-[9px] font-bold uppercase tracking-widest text-emerald-700 dark:text-emerald-300 shadow-md flex items-center gap-1.5 border border-emerald-100 dark:border-emerald-900">
                                    <span class="material-symbols-outlined text-[14px]">corporate_fare</span>
                                    <span>Miembro Corporativo</span>
                                </div>
                            `}
                        </div>
                    </a>
                `;

                if (userAccount && userAccount.role === 'SUPER_ADMINISTRADOR') {
                    if (superAdminLink) superAdminLink.classList.remove('hidden');
                    countEl.textContent = `(${consolidatedCompanies.length})`;

                    list.innerHTML = `
                        <div class="w-full flex flex-col gap-6">
                            <div class="flex items-center gap-2 text-xs font-black uppercase tracking-wider text-gray-500">
                                <span class="material-symbols-outlined text-[16px] text-primary">admin_panel_settings</span>
                                <span>Todas las Empresas Registradas (Vista Super Administrador)</span>
                            </div>
                            <div class="flex flex-wrap justify-start gap-8 lg:gap-12">
                                ${consolidatedCompanies.map(c => renderCard(c, false)).join('')}
                            </div>
                        </div>
                    `;
                    return;
                }

                // Segregate into Belonging ("Mi Empresa") vs Guest companies ("Empresas como Invitado")
                // Guided strictly by Super Admin configuration (empresas.json & consolidatedCompanies)
                const belongingCompanies = [];
                const guestCompanies = [];

                consolidatedCompanies.forEach(c => {
                    const cNameClean = cleanText(c.name);
                    const cRazonClean = cleanText(c.razonSocial);
                    
                    // 1. Is user an administrator of this company?
                    const isAdminOfCompany = Array.isArray(c.admins) && c.admins.some(a => a.toLowerCase().trim() === userEmail);
                    
                    // 2. Is user an internal corporate employee of this company in Super Admin?
                    // Internal corporate members must have role 'ADMINISTRADOR_EMPRESA' OR have empresaUsuario matching the company name AND role is not 'INVITADO'
                    const isInternalMember = Array.isArray(c.members) && c.members.some(m => {
                        if (!m.email || m.email.toLowerCase().trim() !== userEmail) return false;
                        if (m.role === 'ADMINISTRADOR_EMPRESA' || m.role === 'ADMINISTRADOR') return true;
                        if (m.empresaUsuario && (cleanText(m.empresaUsuario) === cNameClean || (cRazonClean && cleanText(m.empresaUsuario) === cRazonClean)) && m.role !== 'INVITADO') return true;
                        return false;
                    });

                    if (isAdminOfCompany || isInternalMember) {
                        belongingCompanies.push(c);
                    } else {
                        // Check if user is an invited member / guest in this company
                        const isExplicitGuestMember = Array.isArray(c.members) && c.members.some(m => 
                            m.email && m.email.toLowerCase().trim() === userEmail
                        );
                        const hasProjectGuestAccess = projectAccessCompanyIds.has(c.id);

                        if (isExplicitGuestMember || hasProjectGuestAccess) {
                            guestCompanies.push(c);
                        }
                    }
                });

                const totalCount = belongingCompanies.length + guestCompanies.length;
                countEl.textContent = `(${totalCount})`;

                if (totalCount === 0) {
                    list.innerHTML = `
                        <div class="flex flex-col items-center justify-center w-full h-full text-center p-12 mx-auto" style="width: 100%;">
                            <span class="material-symbols-outlined text-4xl text-gray-400 mb-4">domain_disabled</span>
                            <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">Sin Empresas Asignadas</h3>
                            <p class="text-sm text-gray-500 max-w-sm">Tu cuenta no tiene empresas asociadas ni invitaciones activas en este momento. Por favor contacta al administrador.</p>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="w-full flex flex-col gap-10">';

                // 1. Sección: Mi Empresa
                if (belongingCompanies.length > 0) {
                    html += `
                        <div class="w-full">
                            <div class="mb-5 flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 inline-block shadow-sm"></span>
                                    <h2 class="text-xs font-black tracking-widest uppercase text-gray-800 dark:text-gray-200">Mi Empresa</h2>
                                    <span class="text-[9px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 px-2 py-0.5 rounded-full">Sede Principal</span>
                                </div>
                                <p class="text-xs text-gray-500 dark:text-gray-400">Espacio de trabajo corporativo al que perteneces directamente.</p>
                            </div>
                            <div class="flex flex-wrap justify-start gap-8 lg:gap-12">
                                ${belongingCompanies.map(c => renderCard(c, false)).join('')}
                            </div>
                        </div>
                    `;
                }

                // 2. Sección: Empresas como Invitado
                if (guestCompanies.length > 0) {
                    html += `
                        <div class="w-full ${belongingCompanies.length > 0 ? 'pt-8 border-t border-gray-200 dark:border-gray-800' : ''}">
                            <div class="mb-5 flex flex-col gap-1">
                                <div class="flex items-center gap-2">
                                    <span class="h-2.5 w-2.5 rounded-full bg-indigo-500 inline-block shadow-sm"></span>
                                    <h2 class="text-xs font-black tracking-widest uppercase text-gray-800 dark:text-gray-200">Empresas como Invitado</h2>
                                    <span class="text-[9px] font-bold bg-indigo-100 text-indigo-800 dark:bg-indigo-950/80 dark:text-indigo-300 px-2 py-0.5 rounded-full">Colaboraciones Externas</span>
                                </div>
                                <p class="text-xs text-gray-500 dark:text-gray-400">Organizaciones y proyectos donde has sido invitado a colaborar.</p>
                            </div>
                            <div class="flex flex-wrap justify-start gap-8 lg:gap-12">
                                ${guestCompanies.map(c => renderCard(c, true)).join('')}
                            </div>
                        </div>
                    `;
                }

                html += '</div>';
                list.innerHTML = html;

            } catch (e) {
                console.error("Error loading companies list:", e);
            }
        });
    </script>
</body>

</html>
